// ── Run command ───────────────────────────────────────────────────────────────
function run(raw) {
  const input = raw.trim();
  if (!input) return;
  addPrompt(input);
  const key = input.toLowerCase();
  const fn = CMDS[key];
  if (fn) {
    const result = fn();
    if (result !== null) addHTML(result);
  } else {
    addHTML(`<div class="out"><span class="err">command not found:</span> <span class="c-gray">${H(input)}</span> &nbsp;&mdash;&nbsp; try <span class="c-green">help</span></div>`);
  }
  scroll();
}

// ── Input handler ─────────────────────────────────────────────────────────────
const history = [];
let histIdx = -1;

cmd.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const val = cmd.value;
    cmd.value = '';
    histIdx = -1;
    if (val.trim()) history.unshift(val.trim());
    run(val);
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) cmd.value = history[++histIdx];
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) cmd.value = history[--histIdx];
    else { histIdx = -1; cmd.value = ''; }
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const partial = cmd.value.toLowerCase().trim();
    const match = Object.keys(CMDS).find(k => k.startsWith(partial) && k !== partial);
    if (match) cmd.value = match;
  }
});

document.querySelector('.body').addEventListener('click', () => cmd.focus());

// ── Auto-play intro ───────────────────────────────────────────────────────────
const intro = [
  { text: 'whoami',     pause: 700 },
  { text: 'about',      pause: 1100 },
  { text: 'projects',   pause: 900 },
  { text: 'contact',    pause: 800 },
  { text: 'help',       pause: 700 },
];

let si = 0, ci = 0, cur = '';

function typeNext() {
  if (si >= intro.length) { cmd.focus(); return; }
  if (ci < cur.length) {
    cmd.value += cur[ci++];
    setTimeout(typeNext, 42 + Math.random() * 38);
  } else {
    setTimeout(() => {
      const val = cmd.value;
      cmd.value = '';
      run(val);
      ci = 0; si++;
      if (si < intro.length) {
        cur = intro[si].text;
        setTimeout(typeNext, intro[si].pause);
      } else {
        cmd.focus();
      }
    }, 280);
  }
}

// Kick off after a short delay

  cur = intro[0].text;
  setTimeout(typeNext, intro[0].pause);
}, 300);
